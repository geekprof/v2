name: Update WCA Data

on:
  push:
    branches:
      - main
  schedule:
    # Tous les jours à 02:00 (Heure de Paris en hiver / 01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:
    # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      pages: write      # Requis pour le déploiement Pages
      id-token: write   # Requis pour l'authentification
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Pipeline
        run: |
          python src/01_fetch_data.py
          python src/02_extract_wca_v2.py
          python src/03_build_stats.py
          python src/04_build_map.py
          python src/05_sync_web_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
